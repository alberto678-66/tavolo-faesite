<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bancone · Demo · Famiglia Tavolo</title>
<meta name="description" content="Demo di Bancone: provalo dal telefono, il PIN di tutti è 1234.">
<meta name="theme-color" content="#8A5A00">
<meta name="robots" content="noindex">
<style>

/* Layout: app a schede per ruolo, pannelli affiancati che si impilano su telefono, finestre modali per le azioni.
   Font di sistema: funziona anche senza internet. Colore del prodotto in --accent. */
:root{
  --bg:#F5F5F2; --surface:#FFFFFF; --sunk:#ECECE7; --line:#D9D8D1;
  --fg:#1C1B18; --muted:#64625A;
  --accent:#8A5A00; --accent-ink:#FFFFFF; --accent-soft:#F6E7C8;
  --ok:#2F6B4F; --ok-soft:#DCEBE2; --warn:#A8600E; --warn-soft:#F7E6CF; --crit:#B3402F; --crit-soft:#F6DCD6; --info:#2D5B8A; --info-soft:#DCE6F2;
  --f-display:ui-rounded,"SF Pro Rounded","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141413; --surface:#1D1D1B; --sunk:#262624; --line:#3A3935; --fg:#ECEBE6; --muted:#A3A198;
  --accent:#F0B03C; --accent-ink:#141413; --accent-soft:#3A2D14;
  --ok:#7CC5A0; --ok-soft:#1F3328; --warn:#E3A04F; --warn-soft:#3A2C18; --crit:#E07766; --crit-soft:#3B211C; --info:#86B2E0; --info-soft:#1C2A3A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141413; --surface:#1D1D1B; --sunk:#262624; --line:#3A3935; --fg:#ECEBE6; --muted:#A3A198;
  --accent:#F0B03C; --accent-ink:#141413; --accent-soft:#3A2D14;
  --ok:#7CC5A0; --ok-soft:#1F3328; --warn:#E3A04F; --warn-soft:#3A2C18; --crit:#E07766; --crit-soft:#3B211C; --info:#86B2E0; --info-soft:#1C2A3A; color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--f-body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1200px;margin:0 auto}
.muted{color:var(--muted)}
.small{font-size:13px}
a{color:var(--accent)}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:calc(14px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:19px;flex:none}
.brand h1{font-family:var(--f-display);font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em;line-height:1.1}
.brand .sub{color:var(--muted);font-size:13px}
.hright{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;font-weight:600}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.user{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 4px 3px 10px;font-size:13px}
.user b{font-weight:600}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
nav.tabs button{background:none;border:0;padding:10px 13px;border-bottom:2.5px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--crit);color:#fff;font-size:11px;line-height:18px;text-align:center;font-weight:600}
.banner{margin-top:12px;padding:9px 12px;border-radius:8px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.crit{background:var(--crit-soft);color:var(--crit)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.info{background:var(--info-soft);color:var(--info)}

main{padding-block:20px}
h2{font-family:var(--f-display);font-size:21px;margin:0 0 4px;text-wrap:balance}
h3{font-family:var(--f-display);font-size:17px;margin:0;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 16px;max-width:68ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.stack{display:grid;gap:16px}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:500;line-height:1.2;text-decoration:none;color:var(--fg);display:inline-block;text-align:center}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.big{padding:12px 18px;font-size:16px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.wa{background:#1F8F4E;border-color:#1F8F4E;color:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;border:0}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.mut{background:var(--sunk);color:var(--muted)}
button.chip{cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;min-width:0}
.kpi b{display:block;font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi span{font-size:12.5px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .main{min-width:0;flex:1}
.li .main b{font-weight:600}
.li .main .muted{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.cards{display:flex;flex-direction:column;gap:10px}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.note{font-size:13px;color:var(--muted);max-width:70ch}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.ok i{background:var(--ok)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:7px 12px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

/* moduli */
.form{display:grid;gap:12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
label.check{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:14px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;width:100%;color:var(--fg)}
input[type=checkbox],input[type=radio]{width:auto}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.full{grid-column:1/-1}

/* accesso */
.full-screen{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:16px;padding-block:32px;text-align:center}
.full-screen .logo{width:64px;height:64px;font-size:32px;border-radius:16px;margin:0 auto}
.full-screen h2{font-size:26px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;max-width:720px;margin:0 auto;width:100%}
.person{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:8px}
.person .av{width:48px;height:48px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:19px}
.person small{color:var(--muted)}
.pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center}
.pinpad button{height:64px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px;font-weight:600}
.dots{display:flex;gap:12px;justify-content:center;margin:6px 0}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent)}
.dots i.on{background:var(--accent)}

/* finestre */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column}
.modal.wide{max-width:900px}
.modal header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal .body{padding:16px 18px;display:grid;gap:14px}
.modal footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;max-width:min(90vw,520px);font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.err{background:var(--crit);color:#fff}
.qr svg{width:180px;height:180px;background:#fff;padding:6px;border-radius:8px}

@media (max-width:860px){.cols,.cols3{grid-template-columns:1fr}}
@media (max-width:480px){.pinpad{grid-template-columns:repeat(3,64px)}.brand h1{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{header.top,nav,.noprint{display:none!important}body{background:#fff;color:#000}}

/* Bancone: plancia della porta con esito grande, tavoli a tessere, tastiera del bar */
.contatore{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.contatore b{font-family:var(--f-display);font-size:34px;line-height:1}
.contatore span{color:var(--muted)}
.bar.warn i{background:var(--warn)}.bar.crit i{background:var(--crit)}
.scan{display:flex;gap:8px;margin:10px 0}
.scan input{flex:1;min-width:0;font-size:22px;letter-spacing:.12em;text-transform:uppercase;padding:12px 14px}
.esito{border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px}
.esito strong{font-family:var(--f-display);font-size:28px;line-height:1.1;text-transform:uppercase;letter-spacing:.02em}
.esito p{margin:0}
.esito.idle{background:var(--sunk);color:var(--muted)}
.esito.okk{background:var(--ok-soft)}.esito.okk strong{color:var(--ok)}
.esito.ko{background:var(--crit-soft)}.esito.ko strong{color:var(--crit)}
.warn-t{color:var(--warn);font-weight:600}
.tipi{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.tipo{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.tavoli{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tav{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:5px;min-height:118px}
.tav .n{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1}
.tav small{color:var(--muted)}
.tav .who{font-size:14px}
.tav.arrivato{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tav.prenotato{border-style:dashed;border-color:var(--info)}
.tav.chiuso{opacity:.6}
.tav .chip{align-self:flex-start}
.drinks{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.drinks .btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;position:relative}
.drinks .btn span{color:var(--muted);font-size:13px}
.drinks.big .btn{min-height:76px}
.drinks .btn em{position:absolute;top:6px;right:8px;font-style:normal;font-weight:800;color:var(--accent-ink);background:var(--accent);border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px}
.qty{display:inline-flex;align-items:center;gap:6px}
.qty b{min-width:24px;text-align:center}
.totale{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.totale b{font-family:var(--f-display);font-size:26px}
.li.storno .main,.li.storno .num{text-decoration:line-through;color:var(--muted)}
.qrbig{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.qrbig svg{width:240px;height:240px;background:#fff;padding:8px;border-radius:10px}
.wa-msg{background:var(--sunk);border-radius:12px 12px 12px 3px;padding:9px 12px;font-size:14px;white-space:pre-line}
.tiporiga{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;padding:8px}
.tiporiga input:first-child{flex:1;min-width:160px}
.chart{display:flex;align-items:flex-end;gap:6px;height:170px}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:3px;min-width:0}
.chart i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.chart b{font-size:11px}.chart small{font-size:10.5px;color:var(--muted)}


@media (max-width:760px){header.top{position:static}}
</style>
</head>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

      var bin = base64DecodeInputStream(unicodeData);

        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {

            } else {

              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };

<script>
"use strict";
const APP_ID="bancone";
/* ---------- Nucleo dell'interfaccia (famiglia Tavolo) ----------

const SIGLA=APP_ID;

/* ---------- Stato ---------- */

/* ---------- Server ---------- */
async function richiesta(url,opt){opt=opt||{};const h=Object.assign({"Content-Type":"application/json"},opt.headers||{});if(token)h.Authorization="Bearer "+token;
  const r=await fetch(url,Object.assign({},opt,{headers:h}));let j={};try{j=await r.json()}catch(e){}
  if(r.status===401&&token&&!url.includes("/login")){esci("Il tuo accesso è scaduto: entra di nuovo con il PIN");throw new Error("401")}
  if(!r.ok)throw new Error(j.errore||"Errore "+r.status);return j}
let coda=Promise.resolve();
function api(type,payload){
  if(!online){toast("Nessuna connessione con il computer dell'attività: riprova tra poco",true);return Promise.resolve(null)}
  const p=coda.then(async()=>{
    try{const j=await richiesta("/api/azione",{method:"POST",body:JSON.stringify({type,payload})});if(j.msg)toast(j.msg);return j}
    catch(e){if(e.message!=="401")toast(/fetch|network|load/i.test(e.message)?"Il computer dell'attività non risponde":e.message,true);return null}});
  coda=p.catch(()=>null);return p}

  es.addEventListener("avviso",e=>{try{const m=JSON.parse(e.data).msg;toast(m);suona()}catch(_){}});
  es.addEventListener("esci",()=>esci("Il tuo accesso è stato chiuso: entra di nuovo con il PIN"));
  es.onopen=()=>{if(!online){online=true;if(S)render()}};
  es.onerror=async()=>{const era=online;online=false;if(S&&era)renderBanners();
    if(es.readyState===2){try{await richiesta("/api/io");setTimeout(connetti,2000)}catch(e){if(e.message!=="401")setTimeout(connetti,3000)}}};
}
function esci(msg){if(es){es.close();es=null}token=null;store.set(SIGLA+"-token",null);S=null;online=false;closeModal();if(msg)toast(msg,true);avvio()}

/* ---------- Accessori ---------- */
const me=()=>S.io==="tecnico"?{id:"tecnico",nome:"Assistenza "+APP.NOME,ruolo:"titolare",tecnico:true}:S.staff.find(s=>s.id===S.io)||{nome:"?",ruolo:Object.keys(APP.RUOLI).pop()};
const ruolo=()=>me().ruolo;
const isTit=()=>ruolo()==="titolare";
const TEC=()=>!!(S&&S.meta&&(S.meta.tecnico||S.meta.demo));
const lic=()=>S.meta.licenza;
const allowedTabs=()=>(APP.ROLE_TABS[ruolo()]||[]).filter(t=>!APP.tabVisibile||APP.tabVisibile(t)).concat(["impostazioni"]);
const staffN=id=>(S.staff.find(x=>x.id===id)||{nome:"—"}).nome;
const CLI=id=>(S.clienti||[]).find(c=>c.id===id);
const cliDaTel=t=>{const n=telN(t);return n.length>=6?(S.clienti||[]).find(c=>telN(c.tel)===n):null};
function contattoAss(){
  if(S&&S.meta&&S.meta.licenza&&S.meta.licenza.assistenza)return S.meta.licenza.assistenza;
  if(INFO&&INFO.assistenza)return INFO.assistenza;
  try{return JSON.parse(store.get(SIGLA+"-assistenza")||"{}")}catch(e){return{}}
}
function copia(t){
  const fallback=()=>{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("Copiato")}catch(e){toast("Seleziona il testo e copialo",true)}a.remove()};

}
function stampaHtml(html){const w=window.open("","_blank");if(!w){toast("Il browser ha bloccato la finestra di stampa: consenti i popup",true);return}w.document.open();w.document.write(html);w.document.close()}
const docStampa=(titolo,corpo,css)=>`<!doctype html><html lang="it"><head><meta charset="utf-8"><title>${esc(titolo)}</title><style>body{font-family:Arial,Helvetica,sans-serif;color:#000;margin:14mm}h1{font-size:18pt;margin:0 0 4mm}h2{font-size:13pt;margin:6mm 0 2mm}table{border-collapse:collapse;width:100%;font-size:10.5pt}td,th{border-bottom:1px solid #999;padding:4px 6px;text-align:left;vertical-align:top}th{font-size:9pt;text-transform:uppercase}.r{text-align:right}.muted{color:#555}${css||""}</style></head><body>${corpo}<script>setTimeout(()=>print(),350)<\/script></body></html>`;
const csvLink=(tipo,extra)=>`/api/csv?tipo=${encodeURIComponent(tipo)}${extra||""}&t=${encodeURIComponent(token)}`;

/* ---------- Finestre e avvisi ---------- */

function openModal(titolo,corpo,piede,opz){opz=opz||{};UI.modal=opz.id||"m";$("modalRoot").innerHTML=`<div class="modal-back" data-act="modalFuori"><div class="modal${opz.wide?" wide":""}" role="dialog" aria-modal="true" aria-label="${esc(titolo)}"><header><h3>${esc(titolo)}</h3><button class="btn ghost sm" data-act="closeModal" aria-label="Chiudi">✕</button></header><div class="body">${corpo}</div>${piede?`<footer>${piede}</footer>`:""}</div></div>`;
  const f=$("modalRoot").querySelector("[autofocus]")||$("modalRoot").querySelector("input,select,textarea");if(f&&!opz.noFocus)setTimeout(()=>f.focus(),30)}

/* ---------- Avvio e accesso ---------- */

const pulisciUrl=()=>{try{history.replaceState(null,"",location.pathname)}catch(e){}};

  <label>PIN del titolare (4 cifre)<input id="suPin" type="password" inputmode="numeric" maxlength="4"></label><label>Ripeti il PIN<input id="suPin2" type="password" inputmode="numeric" maxlength="4"></label></div>

  <div class="panel"><div class="spread"><div><b>Vuoi solo provarlo?</b><div class="muted small">Si apre con dati di esempio. Il PIN di tutti è 1234. Per lavorare davvero si azzera e si configura da capo.</div></div><button class="btn" data-act="setupDemo">Apri la demo</button></div></div></div>`}

  $("top").hidden=true;
  fetch("/api/staff").then(r=>r.json()).then(staff=>{
    UI.staff=staff;UI.pin="";UI.pinUser=null;
    const tit=INFO.licenza&&INFO.licenza.stato==="scaduta"?`<div class="banner crit" style="justify-content:center">Licenza scaduta: contatta l'assistenza per rinnovarla.</div>`:"";
    $("view").innerHTML=`<div class="full-screen"><div class="logo">${APP.LOGO}</div><h2>${esc(INFO.nome)}</h2><p class="lead" style="margin:0 auto">Chi sei? Tocca il tuo nome ed entra con il tuo PIN.</p>${tit}
    <div class="people">${staff.map(x=>`<button class="person" data-act="scegliPersona" data-id="${x.id}"><span class="av">${esc(iniziali(x.nome))}</span><b>${esc(x.nome)}</b><small>${esc(APP.RUOLI[x.ruolo]||x.ruolo)}</small></button>`).join("")}</div>
    <div class="row" style="justify-content:center"><button class="btn sm ghost" data-act="vaiTecnico">Accesso assistenza ${esc(APP.NOME)}</button></div><p class="note" style="margin:0 auto">${esc(APP.NOME)} ${esc(INFO.versione)} · della famiglia Tavolo</p></div>`});
}
function schermataPin(){
  const x=UI.staff.find(y=>y.id===UI.pinUser);if(!x)return schermataLogin();
  $("view").innerHTML=`<div class="full-screen"><div class="person" style="max-width:200px;margin:0 auto;border:0;background:none"><span class="av">${esc(iniziali(x.nome))}</span><b>${esc(x.nome)}</b></div>

  try{const j=await richiesta("/api/login",{method:"POST",body:JSON.stringify({id:UI.pinUser,pin:UI.pin})});token=j.token;store.set(SIGLA+"-token",token);UI.tab=null;$("view").innerHTML=`<p class="empty">Collegamento…</p>`;connetti()}

}

function onStato(prev){
  if(!UI.tab||!allowedTabs().includes(UI.tab)){let h="";try{h=location.hash.slice(1)}catch(e){}UI.tab=allowedTabs().includes(h)?h:allowedTabs()[0]}
  if(APP.onStato)APP.onStato(prev);
  const a=document.activeElement;
  if(a&&$("view").contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&!a.dataset.live){pendingRender=true;renderHeader();return}
  render();
  if(UI.modal&&APP.aggiornaModal)APP.aggiornaModal();
}
function renderHeader(){
  const top=$("top");top.hidden=false;const u=me(),tabs=allowedTabs();
  top.innerHTML=`<div class="wrap"><div class="brand"><div class="logo">${APP.LOGO}</div><div><h1>${esc(S.settings.nome)}</h1><div class="sub">${esc(APP.NOME)}${S.settings.citta?" · "+esc(S.settings.citta):""} · ${esc(dayLong(oggi()))}</div></div>
  <div class="hright">${S.meta.demo?`<span class="pill warn">Demo</span>`:""}${online?"":`<span class="pill crit">Non collegato</span>`}<span class="user"><b>${esc(u.nome)}</b><span class="muted">${esc(APP.RUOLI[u.ruolo]||"")}</span><button class="btn sm" data-act="logout">Esci</button></span></div></div>
  <nav class="tabs" role="tablist">${tabs.map(t=>{const n=APP.badge&&APP.badge[t]?APP.badge[t]():0;return`<button role="tab" aria-selected="${t===UI.tab}" data-act="tab" data-t="${t}">${esc(t==="impostazioni"?"Impostazioni":APP.TABS[t])}${n?`<span class="badge">${n}</span>`:""}</button>`}).join("")}</nav>
  <div id="banners"></div></div>`;
  renderBanners();
}
function renderBanners(){
  const b=$("banners");if(!b||!S)return;const l=lic(),out=[];
  if(!online)out.push(`<div class="banner crit">Collegamento perso con il computer dell'attività: le modifiche non vengono salvate finché non torna.</div>`);
  if(l.stato==="scaduta")out.push(`<div class="banner crit">Licenza scaduta il ${ddmmyy(l.scadenza)}: puoi consultare i dati ma non inserirne di nuovi. Contatta l'assistenza.</div>`);
  else if(l.stato==="tolleranza")out.push(`<div class="banner crit">Licenza scaduta: ancora ${15+l.giorni} giorni per rinnovarla prima del blocco.</div>`);
  else if(l.stato==="prova"&&isTit()&&!S.meta.demo)out.push(`<div class="banner info">Periodo di prova: ancora ${l.giorni} giorni. Per attivare la licenza vai in Impostazioni › Licenza.</div>`);
  else if(l.stato==="in_scadenza"&&isTit())out.push(`<div class="banner warn">La licenza scade tra ${l.giorni} giorni (${ddmmyy(l.scadenza)}).</div>`);
  if(APP.banners)out.push(...APP.banners());
  b.innerHTML=out.join("");
}
function render(){
  if(!S)return;pendingRender=false;renderHeader();
  const fn=UI.tab==="impostazioni"?renderImpostazioni:APP.render[UI.tab];
  const y=window.scrollY;
  $("view").innerHTML=fn?fn():"";
  window.scrollTo(0,y);
  if(APP.dopoRender)APP.dopoRender();
}

/* ---------- Tavoli ---------- */
function prenDi(s,t){return S.prenTavoli.filter(x=>x.serata===s.id&&x.tavolo===t.id&&x.stato!=="annullato").sort((a,b)=>({arrivato:0,prenotato:1,chiuso:2}[a.stato]-{arrivato:0,prenotato:1,chiuso:2}[b.stato]))[0]}

  const pren=S.prenTavoli.filter(x=>x.serata===s.id),occ=pren.filter(x=>["prenotato","arrivato"].includes(x.stato)).length,inc=pren.reduce((t,x)=>t+(x.nome==="Occupato"?0:Math.max(totT(x),0)),0);
  return`<div class="stack"><div class="spread"><div class="row">${selSerata()}</div><span class="muted">${occ} di ${S.tavoli.length} tavoli prenotati${puoConti()?` · consumato ${eur(inc)}`:""}</span></div>
  ${zone.map(z=>`<div><div class="label" style="margin-bottom:8px">${esc(z)}</div><div class="tavoli">${S.tavoli.filter(t=>t.zona===z).map(t=>{const p=prenDi(s,t),st=p?TSTATI[p.stato]:["Libero","mut"],spesa=p?totT(p):0,mio=p&&(!isPr()||p.pr===S.io);

function apriTavolo(tid){const s=serata(),t=TAV(tid),p=prenDi(s,t),chiusa=s.stato==="chiusa";B.tav=tid;
  if(p&&isPr()&&p.pr!==S.io)return openModal("Tavolo "+t.nome,`<p>Questo tavolo è già prenotato per la serata.</p>`,`<button class="btn" data-act="closeModal">Chiudi</button>`);
  if(!p||p.stato==="chiuso"&&false){if(chiusa)return openModal("Tavolo "+t.nome,`<p>La serata è chiusa.</p>`,"");
    return openModal(`Prenota il tavolo ${t.nome}`,`<p class="muted" style="margin:0">${esc(t.zona)} · ${t.posti} posti${t.minimo?` · minimo spesa ${eur(t.minimo)}`:""}</p><div class="fgrid"><label>Nome della prenotazione<input id="tpNome"></label><label>Telefono<input id="tpTel" inputmode="tel"></label><label>Persone<input id="tpPers" inputmode="numeric" value="${t.posti}"></label>
    ${isPr()?"":`<label>PR<select id="tpPr"><option value="">—</option>${S.staff.filter(x=>x.ruolo==="pr"&&x.attivo).map(x=>`<option value="${x.id}">${esc(x.nome)}</option>`).join("")}</select></label><label>Acconto (€)<input id="tpAcc" inputmode="decimal" placeholder="0"></label><label>Pagato con<select id="tpMet">${Object.entries(METODI).map(([k,n])=>`<option value="${k}">${n}</option>`).join("")}</select></label>`}</div><label>Note<input id="tpNote" placeholder="Es. compleanno, torta alle 2"></label>`,
    `<button class="btn" data-act="closeModal">Annulla</button><button class="btn primary" data-act="tpSalva" data-t="${t.id}">Prenota</button>`)}
  const tot=totT(p),pag=pagT(p),dovuto=Math.max(tot,t.minimo||0),bott=S.listino.filter(v=>v.cat==="Bottiglie"),altre=S.listino.filter(v=>v.cat!=="Bottiglie"),[stt,cl]=TSTATI[p.stato];

  <div class="row" style="margin-top:8px"><select id="tvAltro" style="width:auto"><option value="">Altro dal listino…</option>${altre.map(v=>`<option value="${v.id}">${esc(v.nome)} · ${eur(v.prezzo)}</option>`).join("")}</select><button class="btn sm" data-act="tvAltro" data-id="${p.id}">Aggiungi</button></div></div>`:""}
  <div class="tw"><table><tbody>${p.righe.map((r,i)=>`<tr><td>${r.q>1?r.q+"× ":""}${esc(r.nome)}</td><td class="muted small">${hhmm(r.t)}</td><td class="r num">${eur(r.prezzo*r.q)}</td><td>${p.stato==="arrivato"&&puoConti()?`<button class="btn sm ghost" data-act="tvTogli" data-id="${p.id}" data-i="${i}" aria-label="Togli">✕</button>`:""}</td></tr>`).join("")||`<tr><td class="muted">Nessuna consumazione.</td></tr>`}
  <tr><td><b>Consumato</b></td><td></td><td class="r num"><b>${eur(tot)}</b></td><td></td></tr>${t.minimo?`<tr><td>Minimo spesa</td><td></td><td class="r num">${eur(t.minimo)}</td><td></td></tr>`:""}${p.pagamenti.map(x=>`<tr><td>${esc(x.tipo==="acconto"?"Acconto":"Pagato")} · ${esc(METODI[x.metodo])}</td><td></td><td class="r num">−${eur(x.importo)}</td><td></td></tr>`).join("")}</tbody></table></div>
  ${t.minimo&&p.stato==="arrivato"?`<div class="bar ${tot>=t.minimo?"ok":""}"><i style="width:${Math.min(100,tot/t.minimo*100)}%"></i></div><div class="small muted">${tot>=t.minimo?"Minimo raggiunto":`Mancano ${eur(t.minimo-tot)} al minimo`}</div>`:""}
  ${p.stato==="arrivato"&&puoConti()?`<div class="panel form"><h3>Chiudi il conto</h3>${t.minimo>tot?`<label class="check"><input type="checkbox" id="tvMin" checked data-chg="tvMinChg" data-a="${Math.max(0,dovuto-pag)}" data-b="${Math.max(0,tot-pag)}"> Fai pagare il minimo spesa (${eur(t.minimo)})</label>`:""}<div class="totale"><span>Da pagare adesso</span><b class="num" id="tvResto">${eur(Math.max(0,(t.minimo>tot?dovuto:tot)-pag))}</b></div><div class="row">${Object.entries(METODI).map(([k,n])=>`<button class="btn primary" data-act="tvChiudi" data-id="${p.id}" data-m="${k}" ${chiusa?"disabled":""}>${n}</button>`).join("")}</div></div>`:""}`;
  const piede=`${p.stato==="prenotato"&&puoConti()?`<button class="btn danger" data-act="tvStato" data-id="${p.id}" data-s="annullato">Annulla prenotazione</button><button class="btn primary" data-act="tvStato" data-id="${p.id}" data-s="arrivato">Sono arrivati</button>`:""}${p.stato==="prenotato"&&isPr()?`<span class="muted small">La cassa segna l'arrivo.</span>`:""}${p.stato==="chiuso"&&!chiusa?`<button class="btn" data-act="tvNuova" data-t="${t.id}">Nuova prenotazione su questo tavolo</button>`:""}<button class="btn" data-act="closeModal">Chiudi</button>`;
  openModal(`Tavolo ${t.nome}`,corpo,piede,{wide:true,noFocus:true})}

/* ---------- Bar ---------- */
function renderBar(){const s=serata();if(!s)return nessunaSerata();const chiusa=s.stato==="chiusa";
  const cats=[...new Set(S.listino.map(v=>v.cat))];if(!cats.includes(B.cat))B.cat=cats[0];
  const tot=B.scontrino.reduce((t,r)=>t+r.prezzo*r.q,0),bs=S.battute.filter(b=>b.serata===s.id),ok=bs.filter(b=>!b.stornato),incasso=ok.reduce((t,b)=>t+b.totale,0);
  return`<div class="stack"><div class="spread"><div class="row">${selSerata()}</div><span class="muted">Bar della serata: <b class="num">${eur(incasso)}</b> · ${ok.length} scontrini</span></div>
  <div class="cols"><div class="panel"><div class="row" style="gap:4px;margin-bottom:10px">${cats.map(c=>`<button class="chip ${c===B.cat?"acc":"mut"}" data-act="barCat" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>
  <div class="drinks big">${S.listino.filter(v=>v.cat===B.cat).map(v=>`<button class="btn" data-act="barAdd" data-id="${v.id}" ${chiusa?"disabled":""}><b>${esc(v.nome)}</b><span>${eur(v.prezzo)}</span>${(B.scontrino.find(r=>r.id===v.id)||{}).q?`<em>${B.scontrino.find(r=>r.id===v.id).q}</em>`:""}</button>`).join("")}</div></div>
  <div class="stack"><div class="panel"><h3>Scontrino</h3><div class="list">${B.scontrino.map((r,i)=>`<div class="li"><span class="main">${esc(r.nome)}</span><div class="qty"><button class="btn sm" data-act="barQ" data-i="${i}" data-d="-1" aria-label="Uno in meno">−</button><b class="num">${r.q}</b><button class="btn sm" data-act="barQ" data-i="${i}" data-d="1" aria-label="Uno in più">+</button></div><span class="num" style="min-width:70px;text-align:right">${eur(r.prezzo*r.q)}</span></div>`).join("")||`<div class="muted" style="padding:8px 0">Tocca i drink a sinistra.</div>`}</div>
  <div class="totale"><span>Totale</span><b class="num">${eur(tot)}</b></div><div class="row">${Object.entries(METODI).map(([k,n])=>`<button class="btn big primary" style="flex:1" data-act="barPaga" data-m="${k}" ${!B.scontrino.length||chiusa?"disabled":""}>${n}</button>`).join("")}</div>${B.scontrino.length?`<button class="btn ghost sm" data-act="barSvuota">Svuota</button>`:""}</div>
  <div class="panel"><h3>Consumazione inclusa</h3><p class="muted small" style="margin:4px 0 8px">Scrivi o scansiona il codice di chi ha il drink compreso nell'ingresso.</p><form class="scan" onsubmit="event.preventDefault();ACT.drink()"><input id="drCod" class="mono" autocomplete="off" placeholder="Codice"><button class="btn" type="submit" ${chiusa?"disabled":""}>Riscatta</button></form></div>
  <div class="panel"><h3>Ultimi scontrini</h3><div class="list">${bs.slice().sort((a,b)=>b.t-a.t).slice(0,8).map(b=>`<div class="li ${b.stornato?"storno":""}"><span class="mono muted">${hhmm(b.t)}</span><span class="main small">${esc(b.righe.map(r=>(r.q>1?r.q+"× ":"")+r.nome).join(", "))}</span><span class="num">${eur(b.totale)}</span>${puoConti()&&!b.stornato?`<button class="btn sm ghost" data-act="barStorno" data-id="${b.id}">Storna</button>`:b.stornato?`<span class="chip crit">Stornato</span>`:""}</div>`).join("")||`<div class="muted">Ancora niente.</div>`}</div></div></div></div></div>`}

/* ---------- Serate, listino, tavoli ---------- */
function renderSerate(){const sez=B.setSez;
  const head=`<div class="row" style="margin-bottom:4px"><div class="seg">${[["serate","Serate"],["listino","Listino bar"],["tavoli","Tavoli"]].map(([k,n])=>`<button aria-pressed="${sez===k}" data-act="setSez" data-k="${k}">${n}</button>`).join("")}</div></div>`;
  if(sez==="listino")return head+`<div class="panel"><div class="spread"><h2>Listino bar</h2><button class="btn primary" data-act="voceNuova">+ Voce</button></div><div class="tw"><table><thead><tr><th>Voce</th><th>Categoria</th><th class="r">Prezzo</th><th></th></tr></thead><tbody>${S.listino.slice().sort((a,b)=>a.cat.localeCompare(b.cat)).map(v=>`<tr><td><b>${esc(v.nome)}</b></td><td>${esc(v.cat)}</td><td class="r num">${eur(v.prezzo)}</td><td><button class="btn sm" data-act="voceMod" data-id="${v.id}">Modifica</button></td></tr>`).join("")}</tbody></table></div><p class="note">Le voci della categoria "Bottiglie" compaiono come pulsanti rapidi sui tavoli.</p></div>`;
  if(sez==="tavoli")return head+`<div class="panel"><div class="spread"><h2>Tavoli</h2><button class="btn primary" data-act="tavNuovo">+ Tavolo</button></div><div class="tw"><table><thead><tr><th>Tavolo</th><th>Zona</th><th class="r">Posti</th><th class="r">Minimo spesa</th><th></th></tr></thead><tbody>${S.tavoli.map(t=>`<tr><td><b>${esc(t.nome)}</b></td><td>${esc(t.zona)}</td><td class="r num">${t.posti}</td><td class="r num">${t.minimo?eur(t.minimo):"—"}</td><td><button class="btn sm" data-act="tavMod" data-id="${t.id}">Modifica</button></td></tr>`).join("")}</tbody></table></div></div>`;
  const l=S.serate.slice().sort((a,b)=>b.data.localeCompare(a.data));
  return head+`<div class="panel"><div class="spread"><div><h2>Serate</h2><p class="lead" style="margin:0">Ogni serata ha i suoi prezzi d'ingresso, la capienza e la provvigione dei PR.</p></div><button class="btn primary" data-act="serNuova">+ Nuova serata</button></div>
  <div class="tw"><table><thead><tr><th>Serata</th><th>Giorno</th><th>Ingressi</th><th class="r">In lista</th><th class="r">Entrati</th><th>Stato</th><th></th></tr></thead><tbody>${l.map(s=>{const os=S.ospiti.filter(o=>o.serata===s.id),e=S.ingressi.filter(i=>i.serata===s.id).reduce((t,i)=>t+i.n,0);return`<tr><td><b>${esc(s.nome)}</b></td><td>${esc(dayName(s.data))}</td><td class="small">${esc(s.tipi.map(t=>t.nome+" "+(t.prezzo?eur0(t.prezzo):"gratis")).join(" · "))}</td><td class="r num">${os.length}</td><td class="r num">${e}</td><td><span class="chip ${s.stato==="aperta"?"ok":"mut"}">${s.stato==="aperta"?"Aperta":"Chiusa"}</span></td>
  <td><div class="row" style="flex-wrap:nowrap">${s.stato==="aperta"?`<button class="btn sm" data-act="serMod" data-id="${s.id}">Modifica</button><button class="btn sm" data-act="serChiudi" data-id="${s.id}">Chiudi</button>`:`<button class="btn sm ghost" data-act="serRiapri" data-id="${s.id}">Riapri</button>`}</div></td></tr>`}).join("")||`<tr><td colspan="7" class="muted">Nessuna serata.</td></tr>`}</tbody></table></div></div>`}
function formSerata(s){const tipi=s.tipi.map(t=>Object.assign({},t));B.formTipi=tipi;
  return`<div class="fgrid"><label>Nome<input id="sfNome" value="${esc(s.nome||"")}" placeholder="Es. Halloween Night"></label><label>Giorno<input id="sfData" type="date" value="${esc(s.data||"")}"></label><label>Apertura<input id="sfAp" type="time" value="${esc(s.apertura||"23:00")}"></label><label>Capienza<input id="sfCap" inputmode="numeric" value="${s.capienza||S.settings.capienza}"></label><label>Provvigione PR (€ a persona entrata)<input id="sfProv" inputmode="decimal" value="${s.provvigione!=null?String(s.provvigione).replace(".",","):S.settings.provvigione}"></label></div>
  <div><div class="label" style="margin-bottom:6px">Tipi di ingresso</div><div id="sfTipi" class="stack" style="gap:8px">${tipi.map((t,i)=>rigaTipo(t,i,tipi)).join("")}</div><button class="btn sm" data-act="sfTipo" style="margin-top:8px">+ Tipo di ingresso</button>
  <p class="note">"Valido fino alle": dopo quell'ora il tipo diventa quello scelto in "poi" (es. Omaggio entro le 00:30, poi Ridotto). Lascia vuoto se vale tutta la notte.</p></div><label>Note<input id="sfNote" value="${esc(s.note||"")}"></label>`}
const rigaTipo=(t,i,tipi)=>`<div class="tiporiga"><input id="tN${i}" value="${esc(t.nome)}" placeholder="Nome (es. Ridotto in lista)"><input id="tP${i}" inputmode="decimal" value="${String(t.prezzo).replace(".",",")}" placeholder="€" style="width:80px"><label class="small" style="flex-direction:row;align-items:center;gap:4px">fino alle<input id="tF${i}" type="time" value="${esc(t.fino||"")}" style="width:auto"></label>
  <select id="tPoi${i}" style="width:auto"><option value="">poi —</option>${tipi.map((x,j)=>j!==i?`<option value="${x.id}" ${t.poi===x.id?"selected":""}>poi ${esc(x.nome)}</option>`:"").join("")}</select><label class="check small"><input type="checkbox" id="tD${i}" ${t.drink?"checked":""}> drink incluso</label><button class="btn sm ghost" data-act="sfTipoDel" data-i="${i}" aria-label="Togli">✕</button></div>`;
function leggiTipi(){return B.formTipi.map((t,i)=>({id:t.id,nome:val("tN"+i),prezzo:String(val("tP"+i)).replace(",","."),fino:val("tF"+i),poi:val("tPoi"+i),drink:val("tD"+i)}))}

/* ---------- Report ---------- */
function renderReport(){const s=serata();if(!s)return nessunaSerata();
  const ing=S.ingressi.filter(i=>i.serata===s.id),pers=ing.reduce((t,i)=>t+i.n,0),porta=ing.reduce((t,i)=>t+i.prezzo*i.n,0),bar=S.battute.filter(b=>b.serata===s.id&&!b.stornato).reduce((t,b)=>t+b.totale,0),tav=S.prenTavoli.filter(x=>x.serata===s.id).reduce((t,x)=>t+pagT(x),0);
  const perTipo=s.tipi.map(t=>[t,ing.filter(i=>i.tipo===t.id).reduce((x,i)=>x+i.n,0),ing.filter(i=>i.tipo===t.id).reduce((x,i)=>x+i.prezzo*i.n,0)]).filter(x=>x[1]);
  const fasce={};ing.forEach(i=>{const d=new Date(i.t);let m=d.getHours()*60+d.getMinutes();if(m<480)m+=1440;const k=Math.floor(m/30)*30;fasce[k]=(fasce[k]||0)+i.n});const ks=Object.keys(fasce).map(Number).sort((a,b)=>a-b),mx=Math.max(1,...Object.values(fasce));
  const os=S.ospiti.filter(o=>o.serata===s.id),prs=S.staff.filter(x=>x.ruolo==="pr").map(p=>{const l=os.filter(o=>o.pr===p.id),e=l.filter(o=>o.entrato).length;return[p,l.length,e]}).filter(x=>x[1]);
  const top={};S.battute.filter(b=>b.serata===s.id&&!b.stornato).forEach(b=>b.righe.forEach(r=>{const x=top[r.nome]=top[r.nome]||{q:0,e:0};x.q+=r.q;x.e+=r.q*r.prezzo}));
  return`<div class="stack"><div class="spread"><div class="row">${selSerata()}</div><div class="row"><a class="btn" href="${csvLink("incassi","&serata="+s.id)}">Esporta incassi</a><a class="btn" href="${csvLink("pr","&serata="+s.id)}">Provvigioni PR</a></div></div>
  <div class="kpis"><div class="kpi"><b>${pers}</b><span>Persone entrate</span></div><div class="kpi"><b>${eur0(porta)}</b><span>Porta</span></div><div class="kpi"><b>${eur0(bar)}</b><span>Bar</span></div><div class="kpi"><b>${eur0(tav)}</b><span>Tavoli</span></div><div class="kpi"><b>${eur0(porta+bar+tav)}</b><span>Totale serata</span></div></div>
  <div class="cols"><div class="panel"><h3>Ingressi ogni mezz'ora</h3><div class="chart">${ks.map(k=>`<div title="${daMin(k%1440)}: ${fasce[k]} persone"><b>${fasce[k]}</b><i style="height:${fasce[k]/mx*100}%"></i><small>${daMin(k%1440)}</small></div>`).join("")||`<p class="muted">Ancora nessun ingresso.</p>`}</div></div>
  <div class="panel"><h3>Per tipo di ingresso</h3><div class="list">${perTipo.map(([t,n,e])=>`<div class="li"><span class="main">${esc(t.nome)}</span><span class="num">${n} pers.</span><b class="num" style="min-width:80px;text-align:right">${eur(e)}</b></div>`).join("")||`<div class="muted">—</div>`}</div></div></div>
  <div class="cols"><div class="panel"><h3>PR</h3><div class="tw"><table><thead><tr><th>PR</th><th class="r">In lista</th><th class="r">Entrati</th><th class="r">%</th><th class="r">Provvigione</th></tr></thead><tbody>${prs.map(([p,n,e])=>`<tr><td>${esc(p.nome)}</td><td class="r num">${n}</td><td class="r num">${e}</td><td class="r num">${Math.round(e/n*100)}%</td><td class="r num">${eur(e*(s.provvigione||0))}</td></tr>`).join("")||`<tr><td colspan="5" class="muted">Nessuna lista.</td></tr>`}</tbody></table></div></div>
  <div class="panel"><h3>Più venduti al bar</h3><div class="tw"><table><tbody>${Object.entries(top).sort((a,b)=>b[1].e-a[1].e).slice(0,8).map(([n,x])=>`<tr><td>${esc(n)}</td><td class="r num">${x.q}</td><td class="r num">${eur(x.e)}</td></tr>`).join("")||`<tr><td class="muted">—</td></tr>`}</tbody></table></div></div></div></div>`}

const APP={
  NOME:"Bancone",LOGO:"B",SLOGAN:"Liste PR, ingressi con codice, tavoli e bar per pub e locali notturni",ESEMPIO_NOME:"Disco Etna",DEMO_NOME:"Locale Demo",

  TABS:{porta:"Porta",liste:"Liste PR",tavoli:"Tavoli",bar:"Bar",serate:"Serate e listino",report:"Report"},

  impostazioniDati:()=>({capienza:val("stCap"),provvigione:String(val("stProv")).replace(",",".")}),
  banners:()=>{const s=S.serate.length?serata():null;if(!s||s.stato==="chiusa"||ruolo()==="pr")return[];const d=dentro(s);return s.capienza&&d>=s.capienza*.95?[`<div class="banner crit">Capienza quasi piena: ${d} su ${s.capienza}.</div>`]:[]},
