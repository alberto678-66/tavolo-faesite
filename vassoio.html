<style>

/* Layout: app a schede per ruolo, pannelli affiancati che si impilano su telefono, finestre modali per le azioni.
   Font di sistema: funziona anche senza internet. Colore del prodotto in --accent. */
:root{
  --bg:#F5F5F2; --surface:#FFFFFF; --sunk:#ECECE7; --line:#D9D8D1;
  --fg:#1C1B18; --muted:#64625A;
  --accent:#9C4A2F; --accent-ink:#FFFFFF; --accent-soft:#F5E3DA;
  --ok:#2F6B4F; --ok-soft:#DCEBE2; --warn:#A8600E; --warn-soft:#F7E6CF; --crit:#B3402F; --crit-soft:#F6DCD6; --info:#2D5B8A; --info-soft:#DCE6F2;
  --f-display:ui-rounded,"SF Pro Rounded","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141413; --surface:#1D1D1B; --sunk:#262624; --line:#3A3935; --fg:#ECEBE6; --muted:#A3A198;
  --accent:#E59A7C; --accent-ink:#141413; --accent-soft:#3B2620;
  --ok:#7CC5A0; --ok-soft:#1F3328; --warn:#E3A04F; --warn-soft:#3A2C18; --crit:#E07766; --crit-soft:#3B211C; --info:#86B2E0; --info-soft:#1C2A3A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141413; --surface:#1D1D1B; --sunk:#262624; --line:#3A3935; --fg:#ECEBE6; --muted:#A3A198;
  --accent:#E59A7C; --accent-ink:#141413; --accent-soft:#3B2620;
  --ok:#7CC5A0; --ok-soft:#1F3328; --warn:#E3A04F; --warn-soft:#3A2C18; --crit:#E07766; --crit-soft:#3B211C; --info:#86B2E0; --info-soft:#1C2A3A; color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--f-body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1200px;margin:0 auto}
.muted{color:var(--muted)}
.small{font-size:13px}
a{color:var(--accent)}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:calc(14px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:19px;flex:none}
.brand h1{font-family:var(--f-display);font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em;line-height:1.1}
.brand .sub{color:var(--muted);font-size:13px}
.hright{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;font-weight:600}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.user{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 4px 3px 10px;font-size:13px}
.user b{font-weight:600}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
nav.tabs button{background:none;border:0;padding:10px 13px;border-bottom:2.5px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--crit);color:#fff;font-size:11px;line-height:18px;text-align:center;font-weight:600}
.banner{margin-top:12px;padding:9px 12px;border-radius:8px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.crit{background:var(--crit-soft);color:var(--crit)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.info{background:var(--info-soft);color:var(--info)}

main{padding-block:20px}
h2{font-family:var(--f-display);font-size:21px;margin:0 0 4px;text-wrap:balance}
h3{font-family:var(--f-display);font-size:17px;margin:0;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 16px;max-width:68ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.stack{display:grid;gap:16px}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:500;line-height:1.2;text-decoration:none;color:var(--fg);display:inline-block;text-align:center}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.big{padding:12px 18px;font-size:16px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.wa{background:#1F8F4E;border-color:#1F8F4E;color:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;border:0}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.mut{background:var(--sunk);color:var(--muted)}
button.chip{cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;min-width:0}
.kpi b{display:block;font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi span{font-size:12.5px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .main{min-width:0;flex:1}
.li .main b{font-weight:600}
.li .main .muted{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.cards{display:flex;flex-direction:column;gap:10px}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.note{font-size:13px;color:var(--muted);max-width:70ch}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.ok i{background:var(--ok)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:7px 12px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

/* moduli */
.form{display:grid;gap:12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
label.check{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:14px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;width:100%;color:var(--fg)}
input[type=checkbox],input[type=radio]{width:auto}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.full{grid-column:1/-1}

/* accesso */
.full-screen{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:16px;padding-block:32px;text-align:center}
.full-screen .logo{width:64px;height:64px;font-size:32px;border-radius:16px;margin:0 auto}
.full-screen h2{font-size:26px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;max-width:720px;margin:0 auto;width:100%}
.person{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:8px}
.person .av{width:48px;height:48px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:19px}
.person small{color:var(--muted)}
.pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center}
.pinpad button{height:64px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px;font-weight:600}
.dots{display:flex;gap:12px;justify-content:center;margin:6px 0}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent)}
.dots i.on{background:var(--accent)}

/* finestre */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column}
.modal.wide{max-width:900px}
.modal header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal .body{padding:16px 18px;display:grid;gap:14px}
.modal footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:90;max-width:min(90vw,520px);font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.err{background:var(--crit);color:#fff}
.qr svg{width:180px;height:180px;background:#fff;padding:6px;border-radius:8px}

@media (max-width:860px){.cols,.cols3{grid-template-columns:1fr}}
@media (max-width:760px){header.top{position:static}}
@media (max-width:480px){.pinpad{grid-template-columns:repeat(3,64px)}.brand h1{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{header.top,nav,.noprint{display:none!important}body{background:#fff;color:#000}}

/* ---------- Telefono e schermi touch ---------- */
.fgrid{grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr))}
.modal .body{min-width:0}
.modal .body>*{min-width:0}
@media (max-width:760px),(pointer:coarse){
  .btn{min-height:44px;min-width:44px;padding:10px 14px}
  .btn.sm{min-height:38px;padding:7px 12px}
  .btn.ghost.sm{min-width:38px}
  .seg button{min-height:44px;padding:9px 14px}
  button.chip{min-height:32px;padding:5px 12px;font-size:13px}
  nav.tabs button{min-height:46px}
  input,select,textarea{font-size:16px;min-height:44px}   /* sotto i 16px iPhone ingrandisce la pagina al tocco */
  textarea{min-height:88px}
  input[type=checkbox],input[type=radio]{width:22px;height:22px;min-height:0;flex:none}
  input[type=color]{min-height:44px}
  label.check{min-height:40px}
  th{font-size:12px}
  .badge{font-size:12px;line-height:19px;min-width:19px}
  .label{font-size:12px}
  .chip{font-size:12.5px}
}
@media (max-width:760px){
  body{font-size:16px}
  header.top{padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .brand{gap:10px}
  .brand .sub{font-size:12.5px}
  .hright{width:100%;justify-content:flex-end}
  main{padding-block:14px}
  h2{font-size:20px}
  .lead{font-size:15px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi b{font-size:21px}
  /* le finestre diventano schede che salgono dal basso, con i pulsanti sempre visibili */
  .modal-back{padding:0;align-items:flex-end;overflow:hidden}
  .modal{max-width:none!important;border-radius:18px 18px 0 0;max-height:calc(100dvh - 18px);max-height:calc(100vh - 18px)}
  @supports (height:100dvh){.modal{max-height:calc(100dvh - 18px)}}
  .modal header{padding:14px 16px}
  .modal .body{padding:14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .modal footer{padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));position:sticky;bottom:0;background:var(--surface)}
  .modal footer .btn{flex:1 1 auto}
  .toast{bottom:calc(16px + env(safe-area-inset-bottom,0px));width:calc(100% - 32px);text-align:center}
  .full-screen{min-height:auto;padding-block:20px}
  .people{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pinpad{grid-template-columns:repeat(3,76px)}
  .pinpad button{height:68px}
}

/* Vassoio: striscia dei giorni di ritiro, schede ordine con ora a sinistra, foglio di produzione */
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.day{flex:0 0 auto;min-width:76px;text-align:left;padding:7px 10px;display:flex;flex-direction:column;gap:1px;border:1px solid var(--line);background:var(--surface);border-radius:9px}
.day small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.day strong{font-size:18px;font-variant-numeric:tabular-nums;line-height:1.1}
.day em{font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.day.festa em{color:var(--accent);font-weight:700}
.day[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.day[aria-pressed="true"] small,.day[aria-pressed="true"] em{color:inherit;opacity:.85}
.ord{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:start}
.ord.ritirato,.ord.annullato{opacity:.62}
.ord.pronto{border-left:4px solid var(--ok)}
.ord .ora{font-size:18px;font-weight:700;display:flex;flex-direction:column;line-height:1.1}
.ord .ora small{font-size:12.5px;color:var(--muted);font-weight:500;font-family:var(--f-body)}
.ord .righe{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px;font-size:14px}
.ord .righe i{color:var(--muted)}
.ord .lato{display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right}
.ord .tot{font-weight:700;font-size:16px}
.scritta{margin-top:6px;display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:3px 9px;font-weight:600;font-size:14px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;margin-top:8px}
.pick .btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:8px 10px}
.pick .btn span{font-size:12.5px;color:var(--muted)}
.righe-t input{padding:6px 8px}
.totale{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:10px}
.totale b{font-family:var(--f-display);font-size:24px}
.allg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:4px 10px}
.prodli{cursor:pointer;gap:12px;justify-content:flex-start;flex-direction:row;align-items:center;color:var(--fg);font-size:15px}
.prodli input{width:22px;height:22px;flex:none}
.prodli .q{font-size:17px;white-space:nowrap}
.prodli.fatto .main,.prodli.fatto .q{text-decoration:line-through;color:var(--muted)}
.crit-t{color:var(--crit);font-weight:600}
.chart{display:flex;align-items:flex-end;gap:3px;height:160px;padding-top:8px}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:3px;min-width:0}
.chart i{display:block;width:100%;background:var(--accent);opacity:.55;border-radius:3px 3px 0 0}
.chart i.f{opacity:1}
.chart small{font-size:12px;color:var(--muted);height:15px}
@media (max-width:620px){.ord{grid-template-columns:minmax(0,1fr) auto}.ord .ora{grid-column:1/-1;flex-direction:row;gap:8px;align-items:baseline}.ord .lato{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;justify-content:space-between;align-items:center}}

@media (max-width:760px){.pick{grid-template-columns:repeat(2,minmax(0,1fr))}.righe-t input{min-height:40px}.ord{padding:12px}.prodli{min-height:52px}}


@media (max-width:760px){header.top{position:static}}
</style>

function onStato(prev){
  if(!UI.tab||!allowedTabs().includes(UI.tab)){let h="";try{h=location.hash.slice(1)}catch(e){}UI.tab=allowedTabs().includes(h)?h:allowedTabs()[0]}
  if(APP.onStato)APP.onStato(prev);
  const a=document.activeElement;
  if(a&&$("view").contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&!a.dataset.live){pendingRender=true;renderHeader();return}
  render();

}
function renderHeader(){
  const top=$("top");top.hidden=false;const u=me(),tabs=allowedTabs();
  top.innerHTML=`<div class="wrap"><div class="brand"><div class="logo">${APP.LOGO}</div><div><h1>${esc(S.settings.nome)}</h1><div class="sub">${esc(APP.NOME)}${S.settings.citta?" · "+esc(S.settings.citta):""} · ${esc(dayLong(oggi()))}</div></div>
  <div class="hright">${S.meta.demo?`<span class="pill warn">Demo</span>`:""}${online?"":`<span class="pill crit">Non collegato</span>`}<span class="user"><b>${esc(u.nome)}</b><span class="muted">${esc(APP.RUOLI[u.ruolo]||"")}</span><button class="btn sm" data-act="logout">Esci</button></span></div></div>
  <nav class="tabs" role="tablist">${tabs.map(t=>{const n=APP.badge&&APP.badge[t]?APP.badge[t]():0;return`<button role="tab" aria-selected="${t===UI.tab}" data-act="tab" data-t="${t}">${esc(t==="impostazioni"?"Impostazioni":APP.TABS[t])}${n?`<span class="badge">${n}</span>`:""}</button>`}).join("")}</nav>
  <div id="banners"></div></div>`;
  renderBanners();
}
function renderBanners(){
  const b=$("banners");if(!b||!S)return;const l=lic(),out=[];
  if(!online)out.push(`<div class="banner crit">Collegamento perso con il computer dell'attività: le modifiche non vengono salvate finché non torna.</div>`);
  if(l.stato==="scaduta")out.push(`<div class="banner crit">Licenza scaduta il ${ddmmyy(l.scadenza)}: puoi consultare i dati ma non inserirne di nuovi. Contatta l'assistenza.</div>`);
  else if(l.stato==="tolleranza")out.push(`<div class="banner crit">Licenza scaduta: ancora ${15+l.giorni} giorni per rinnovarla prima del blocco.</div>`);
  else if(l.stato==="prova"&&isTit()&&!S.meta.demo)out.push(`<div class="banner info">Periodo di prova: ancora ${l.giorni} giorni. Per attivare la licenza vai in Impostazioni › Licenza.</div>`);
  else if(l.stato==="in_scadenza"&&isTit())out.push(`<div class="banner warn">La licenza scade tra ${l.giorni} giorni (${ddmmyy(l.scadenza)}).</div>`);
  if(APP.banners)out.push(...APP.banners());
  b.innerHTML=out.join("");
}
function render(){
  if(!S)return;pendingRender=false;renderHeader();
  const fn=UI.tab==="impostazioni"?renderImpostazioni:APP.render[UI.tab];
  const y=window.scrollY;
  $("view").innerHTML=fn?fn():"";
  window.scrollTo(0,y);
  if(APP.dopoRender)APP.dopoRender();
}

const righeTxt=o=>o.righe.map(r=>`${qTxt(r.q,r.um)} ${r.nome}${r.nota?` (${r.nota})`:""}`).join(", ");

/* feste: le ricorrenze che riempiono il laboratorio */
function pasqua(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return dkey(new Date(y,mo-1,da))}
const FESTE={};
function feste(y){if(FESTE[y])return FESTE[y];const f={},P=pasqua(y),add=(k,n)=>f[k]=n;
  add(`${y}-01-01`,"Capodanno");add(`${y}-01-06`,"Epifania");add(`${y}-02-05`,"Sant'Agata");add(`${y}-02-14`,"San Valentino");add(`${y}-03-19`,"San Giuseppe");
  add(plusDays(P,-47),"Martedì grasso");add(plusDays(P,-1),"Sabato Santo");add(P,"Pasqua");add(plusDays(P,1),"Pasquetta");
  const mag=new Date(y,4,1);const dom2=dkey(new Date(y,4,1+((7-mag.getDay())%7)+7));add(dom2,"Festa della mamma");
  add(`${y}-08-15`,"Ferragosto");add(`${y}-11-01`,"Ognissanti");add(`${y}-11-02`,"Festa dei Morti");add(`${y}-12-08`,"Immacolata");add(`${y}-12-13`,"Santa Lucia");
  add(`${y}-12-24`,"Vigilia di Natale");add(`${y}-12-25`,"Natale");add(`${y}-12-31`,"San Silvestro");return FESTE[y]=f}
const festa=k=>feste(+k.slice(0,4))[k]||"";

function msgConferma(o){return`Ciao ${o.nome.split(" ")[0]}! Abbiamo registrato il tuo ordine n. ${o.num} per ${dayLong(o.data)} alle ${o.ora}:\n${o.righe.map(r=>`- ${qTxt(r.q,r.um)} ${r.nome}`).join("\n")}${o.scritta?`\nScritta: "${o.scritta}"`:""}\nTotale ${eur(totO(o))}${pagO(o)>0?`, acconto ricevuto ${eur(pagO(o))}, da saldare al ritiro ${eur(resO(o))}`:""}.\nGrazie! ${firma()}`}
function msgPronto(o){return`Ciao ${o.nome.split(" ")[0]}! Il tuo ordine n. ${o.num} è pronto${o.consegna?" e sta per partire":""}. ${o.consegna?"":`Ti aspettiamo${S.settings.orari?` (${S.settings.orari})`:""}.`}${resO(o)>0?` Da saldare: ${eur(resO(o))}.`:""}\n${firma()}`}

function stripGiorni(sel,act,conta){const g0=oggi(),out=[];
  for(let i=-1;i<14;i++){const k=plusDays(g0,i),n=conta(k),f=festa(k);
    out.push(`<button class="day${f?" festa":""}" aria-pressed="${k===sel}" data-act="${act}" data-k="${k}"><small>${i===0?"Oggi":i===1?"Domani":i===-1?"Ieri":new Date(k+"T12:00").toLocaleDateString("it-IT",{weekday:"short"})}</small><strong>${+k.slice(8)}</strong><em>${f?esc(f):n?n+(n===1?" ordine":" ordini"):"—"}</em></button>`)}
  return`<div class="days">${out.join("")}</div>`}
const ordiniDel=k=>S.ordini.filter(o=>o.data===k&&o.stato!=="annullato");

  <div class="righe">${o.righe.map(x=>`<span><b class="num">${esc(qTxt(x.q,x.um))}</b> ${esc(x.nome)}${x.nota?` <i>(${esc(x.nota)})</i>`:""}</span>`).join("")}</div>
  ${o.scritta?`<div class="scritta">✎ “${esc(o.scritta)}”</div>`:""}${o.note?`<div class="muted small">${esc(o.note)}</div>`:""}${o.consegna?`<div class="muted small">↦ ${esc(o.indirizzo)}</div>`:""}</div>
  <div class="lato">${ch&&ruolo()!=="__nessuno"?`<button class="chip ${cl}" data-act="ordStato" data-id="${o.id}" title="Tocca per cambiare">${st} ›</button>`:`<span class="chip ${cl}">${st}</span>`}
  ${ruolo()!=="laboratorio"?`<span class="num tot">${eur(t)}</span><span class="small ${r>0&&ch?"":"muted"}">${o.stato==="annullato"?"":r>0?"resta "+eur(r):"saldato"}</span>`:""}
  <div class="row" style="justify-content:flex-end;gap:6px">${ch&&puo.incasso()?`<button class="btn sm primary" data-act="ordRitira" data-id="${o.id}">Ritira</button>`:""}${ch&&o.stato==="pronto"&&o.tel&&puo.ordini()?`<a class="btn sm wa" target="_blank" rel="noopener" data-act="ordAvvisa" data-id="${o.id}" href="${waLink(o.tel,msgPronto(o))}">Avvisa</a>`:""}<button class="btn sm" data-act="ordDettagli" data-id="${o.id}">Dettagli</button></div></div></article>`}
function renderRitiri(){

  <div class="spread" style="margin-top:6px"><span>Resta da pagare</span><b class="num">${eur(resO(o))}</b></div></div>`:""}
  ${ch&&puo.incasso()&&resO(o)>0?`<div class="row"><input id="dpImp" inputmode="decimal" placeholder="Importo" style="width:120px"><select id="dpMet" style="width:auto">${Object.entries(METODI).map(([k,n])=>`<option value="${k}">${n}</option>`).join("")}</select><button class="btn" data-act="detPaga" data-id="${o.id}">Registra pagamento</button></div>`:""}
  ${o.tel&&puo.ordini()?`<div class="row"><a class="btn wa" target="_blank" rel="noopener" href="${waLink(o.tel,msgConferma(o))}" data-act="ordConfermaWa" data-id="${o.id}">Manda conferma su WhatsApp</a>${o.stato==="pronto"?`<a class="btn wa" target="_blank" rel="noopener" href="${waLink(o.tel,msgPronto(o))}" data-act="ordAvvisa" data-id="${o.id}">Avvisa che è pronto</a>`:""}</div>`:""}
  <p class="note">Ordine n. ${o.num} · preso da ${esc(o.chi)} il ${new Date(o.creato).toLocaleString("it-IT",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}${o.confermato?" · conferma mandata":""}${o.avvisato?" · avvisato che è pronto":""}${o.motivo?" · motivo annullamento: "+esc(o.motivo):""}</p>`;
  const piede=`<button class="btn" data-act="ordStampa" data-id="${o.id}">Stampa ricevuta</button>${ch&&puo.ordini()?`<button class="btn danger" data-act="ordAnnulla" data-id="${o.id}">Annulla ordine</button><button class="btn" data-act="ordModifica" data-id="${o.id}">Modifica</button>`:""}${o.stato==="ritirato"&&puo.ordini()&&Date.now()-(o.ritiratoAlle||0)<12*3600e3?`<button class="btn" data-act="ordRiapri" data-id="${o.id}">Riapri</button>`:""}${ch&&puo.incasso()?`<button class="btn primary" data-act="ordRitira" data-id="${o.id}">Ritira</button>`:""}`;

function ricevuta(o){const s=S.settings;

  <tr><td></td><td><b>Totale</b></td><td class="r"><b>${eur(totO(o))}</b></td></tr><tr><td></td><td>Pagato</td><td class="r">${eur(pagO(o))}</td></tr><tr><td></td><td><b>Da pagare al ritiro</b></td><td class="r"><b>${eur(resO(o))}</b></td></tr></table>
  ${o.scritta?`<p>Scritta: “${esc(o.scritta)}”</p>`:""}${o.note?`<p class="muted">${esc(o.note)}</p>`:""}<p class="muted" style="font-size:9pt">${esc(s.testoRicevuta||"")}</p></div>`,

/* ---------- Produzione ---------- */
function aggrega(k){const m={};ordiniDel(k).forEach(o=>o.righe.forEach(r=>{const key=(r.pid||r.nome)+"|"+r.um;const x=m[key]=m[key]||{key,nome:r.nome,um:r.um,q:0,ordini:[],cat:(PR(r.pid)||{cat:"Altro"}).cat,consegnati:0};x.q+=+r.q;x.ordini.push(o.num);if(o.stato==="ritirato")x.consegnati+=+r.q}));
  return Object.values(m).sort((a,b)=>a.cat.localeCompare(b.cat)||a.nome.localeCompare(b.nome))}
function renderProduzione(){
  if(!V.prod)V.prod=oggi();const k=V.prod,ag=aggrega(k),fatti=S.prodFatto[k]||{},torte=ordiniDel(k).filter(o=>o.scritta||o.note).sort((a,b)=>a.ora.localeCompare(b.ora));

  return`<div class="stack"><div class="spread"><div><h2>Da produrre · ${esc(dayLong(k))}${festa(k)?" · "+esc(festa(k)):""}</h2><p class="lead" style="margin:0">Somma di tutti gli ordini del giorno. Spunta quello che è pronto: lo vedono tutti i tablet.</p></div>

  <div class="cols"><div class="panel"><div class="spread"><h3>Prodotti</h3><span class="chip ${nFatti===ag.length&&ag.length?"ok":"mut"}">${nFatti} di ${ag.length} pronti</span></div>
  ${ag.length?cats.map(c=>`<div class="label" style="margin-top:14px">${esc(c)}</div><div class="list">${ag.filter(x=>x.cat===c).map(x=>`<label class="li prodli ${fatti[x.key]?"fatto":""}"><input type="checkbox" data-chg="prodFatto" data-k="${esc(x.key)}" ${fatti[x.key]?"checked":""} ${online?"":"disabled"}><span class="main"><b>${esc(x.nome)}</b><span class="muted small"> · ordini ${x.ordini.map(n=>"n. "+n).join(", ")}${x.consegnati?` · ${esc(qTxt(round2(x.consegnati),x.um))} già ritirati`:""}</span></span><b class="num q">${esc(qTxt(round2(x.q),x.um))}</b></label>`).join("")}</div>`).join(""):`<div class="empty">Niente da produrre per questo giorno.</div>`}</div>
  <div class="panel"><h3>Torte e richieste particolari</h3><div class="list">${torte.map(o=>`<div class="li"><div class="main"><b class="num">${esc(o.ora)}</b> · n. ${o.num} · ${esc(o.nome)}<div>${esc(righeTxt(o))}</div>${o.scritta?`<div class="scritta">✎ “${esc(o.scritta)}”</div>`:""}${o.note?`<div class="muted small">${esc(o.note)}</div>`:""}</div><span class="chip ${STATI[o.stato][1]}">${STATI[o.stato][0]}</span></div>`).join("")||`<div class="muted">Nessuna scritta o nota per questo giorno.</div>`}</div></div></div></div>`}
function foglioProduzione(k){const ag=aggrega(k),torte=ordiniDel(k).filter(o=>o.scritta||o.note);
  return docStampa("Produzione "+k,`<h1>Produzione · ${esc(dayLong(k))}</h1><p class="muted">${esc(S.settings.nome)} · stampato alle ${hhmm(Date.now())}</p>
  <table><thead><tr><th>✓</th><th>Prodotto</th><th class="r">Quantità</th><th>Ordini</th></tr></thead><tbody>${ag.map(x=>`<tr><td>☐</td><td>${esc(x.nome)}</td><td class="r"><b>${esc(qTxt(round2(x.q),x.um))}</b></td><td>${x.ordini.join(", ")}</td></tr>`).join("")}</tbody></table>
  ${torte.length?`<h2>Scritte e note</h2><table>${torte.map(o=>`<tr><td>${esc(o.ora)}</td><td>n. ${o.num} ${esc(o.nome)}</td><td>${esc(righeTxt(o))}${o.scritta?`<br><b>“${esc(o.scritta)}”</b>`:""}${o.note?`<br>${esc(o.note)}`:""}</td></tr>`).join("")}</table>`:""}`)}

/* ---------- Cassa ---------- */
function movimenti(k){const r=[];S.ordini.forEach(o=>(o.pagamenti||[]).forEach(p=>{if(dkey(p.t-3*3600e3)===k)r.push(Object.assign({o},p))}));return r.sort((a,b)=>b.t-a.t)}
function renderCassa(){
  if(!V.cassa)V.cassa=oggi();const k=V.cassa,m=movimenti(k),tot=m.reduce((s,x)=>s+x.importo,0);
  const perMet=Object.keys(METODI).map(x=>[x,m.filter(y=>y.metodo===x).reduce((s,y)=>s+y.importo,0)]).filter(([,v])=>v);
  const acc=m.filter(x=>x.tipo==="acconto").reduce((s,x)=>s+x.importo,0),sal=m.filter(x=>x.tipo==="saldo").reduce((s,x)=>s+x.importo,0),rim=m.filter(x=>x.tipo==="rimborso").reduce((s,x)=>s+x.importo,0);
  const futuri=S.ordini.filter(o=>aperti(o)&&o.data>=oggi()),accFut=futuri.reduce((s,o)=>s+pagO(o),0),daInc=futuri.reduce((s,o)=>s+Math.max(0,resO(o)),0);
  return`<div class="stack"><div class="spread"><div><h2>Cassa · ${esc(dayLong(k))}</h2><p class="lead" style="margin:0">Acconti e saldi registrati in ${esc(APP.NOME)}. Ricorda di battere ogni importo sul registratore di cassa.</p></div>
  <div class="row"><input type="date" id="cData" data-chg="cData" value="${k}" style="width:auto" aria-label="Giorno">${isTit()?`<a class="btn" href="${csvLink("incassi")}">Esporta incassi</a>`:""}</div></div>
  <div class="kpis"><div class="kpi"><b>${eur(tot)}</b><span>Incassato nel giorno</span></div><div class="kpi"><b>${eur(acc)}</b><span>Acconti</span></div><div class="kpi"><b>${eur(sal)}</b><span>Saldi al ritiro</span></div>${rim?`<div class="kpi"><b>${eur(rim)}</b><span>Rimborsi</span></div>`:""}${perMet.map(([x,v])=>`<div class="kpi"><b>${eur(v)}</b><span>${esc(METODI[x])}</span></div>`).join("")}</div>
  <div class="cols"><div class="panel"><h3>Movimenti</h3><div class="tw"><table><thead><tr><th>Ora</th><th>Ordine</th><th>Tipo</th><th>Metodo</th><th class="r">Importo</th></tr></thead><tbody>${m.map(x=>`<tr><td class="num">${hhmm(x.t)}</td><td>n. ${x.o.num} · ${esc(x.o.nome)}</td><td>${esc(x.tipo)}</td><td>${esc(METODI[x.metodo]||x.metodo)}</td><td class="r num">${eur(x.importo)}</td></tr>`).join("")||`<tr><td colspan="5" class="muted">Nessun movimento.</td></tr>`}</tbody></table></div></div>
  <div class="panel"><h3>Ordini ancora da ritirare</h3><div class="list"><div class="li"><span class="main">Ordini aperti da oggi in poi</span><b class="num">${futuri.length}</b></div><div class="li"><span class="main">Acconti già incassati</span><b class="num">${eur(accFut)}</b></div><div class="li"><span class="main">Da incassare ai ritiri</span><b class="num">${eur(daInc)}</b></div></div>
  <p class="note">Gli acconti di ordini annullati senza rimborso restano incassati.</p></div></div></div>`}

/* ---------- Catalogo ---------- */

function formProdotto(p){p=p||{um:"kg",cat:S.settings.categorie[0],all:[],disp:true};

  <label class="check"><input type="checkbox" id="pDisp" ${p.disp?"checked":""}> Ordinabile</label>`}

/* ---------- Clienti ---------- */
function renderClienti(){const q=(V.cq||"").trim().toLowerCase();
  const info=S.clienti.map(c=>{const os=S.ordini.filter(o=>o.clienteId===c.id&&o.stato!=="annullato");return{c,n:os.length,tot:os.reduce((s,o)=>s+totO(o),0),ult:os.map(o=>o.data).sort().pop()||""}})
    .filter(x=>!q||(x.c.nome+" "+x.c.tel).toLowerCase().includes(q)).sort((a,b)=>b.ult.localeCompare(a.ult)).slice(0,200);

/* ---------- Report ---------- */
function renderReport(){const g0=oggi(),da=plusDays(g0,-29),os=S.ordini.filter(o=>o.data>=da&&o.data<=g0&&o.stato!=="annullato");
  const tot=os.reduce((s,o)=>s+totO(o),0),giorni=[];for(let i=29;i>=0;i--){const k=plusDays(g0,-i);giorni.push([k,os.filter(o=>o.data===k).reduce((s,o)=>s+totO(o),0),os.filter(o=>o.data===k).length])}
  const max=Math.max(1,...giorni.map(g=>g[1])),prod={};os.forEach(o=>o.righe.forEach(r=>{const k=r.nome+"|"+r.um,x=prod[k]=prod[k]||{nome:r.nome,um:r.um,q:0,e:0};x.q+=+r.q;x.e+=r.q*r.prezzo}));
  const top=Object.values(prod).sort((a,b)=>b.e-a.e).slice(0,10),ann=S.ordini.filter(o=>o.data>=da&&o.data<=g0&&o.stato==="annullato").length;
  const prossime=[];for(let i=0;i<60;i++){const k=plusDays(g0,i);if(festa(k))prossime.push([k,festa(k),ordiniDel(k).length])}
  return`<div class="stack"><div><h2>Ultimi 30 giorni</h2><p class="lead" style="margin:0">Ordini con ritiro dal ${ddmmyy(da)} a oggi.</p></div>
