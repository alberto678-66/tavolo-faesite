<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Poltrona · Demo · Famiglia Tavolo</title>
<meta name="description" content="Demo di Poltrona: provalo dal telefono, il PIN di tutti è 1234.">
<meta name="theme-color" content="#7A3B6B">
<meta name="robots" content="noindex">
<style>

/* Layout: app a schede per ruolo, pannelli affiancati che si impilano su telefono, finestre modali per le azioni.
   Font di sistema: funziona anche senza internet. Colore del prodotto in --accent. */
:root{
  --bg:#F5F5F2; --surface:#FFFFFF; --sunk:#ECECE7; --line:#D9D8D1;
  --fg:#1C1B18; --muted:#64625A;
  --accent:#7A3B6B; --accent-ink:#FFFFFF; --accent-soft:#F1E3EE;
  --ok:#2F6B4F; --ok-soft:#DCEBE2; --warn:#A8600E; --warn-soft:#F7E6CF; --crit:#B3402F; --crit-soft:#F6DCD6; --info:#2D5B8A; --info-soft:#DCE6F2;
  --f-display:ui-rounded,"SF Pro Rounded","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141413; --surface:#1D1D1B; --sunk:#262624; --line:#3A3935; --fg:#ECEBE6; --muted:#A3A198;
  --accent:#D79BC6; --accent-ink:#141413; --accent-soft:#3A2535;
  --ok:#7CC5A0; --ok-soft:#1F3328; --warn:#E3A04F; --warn-soft:#3A2C18; --crit:#E07766; --crit-soft:#3B211C; --info:#86B2E0; --info-soft:#1C2A3A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141413; --surface:#1D1D1B; --sunk:#262624; --line:#3A3935; --fg:#ECEBE6; --muted:#A3A198;
  --accent:#D79BC6; --accent-ink:#141413; --accent-soft:#3A2535;
  --ok:#7CC5A0; --ok-soft:#1F3328; --warn:#E3A04F; --warn-soft:#3A2C18; --crit:#E07766; --crit-soft:#3B211C; --info:#86B2E0; --info-soft:#1C2A3A; color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--f-body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1200px;margin:0 auto}
.muted{color:var(--muted)}
.small{font-size:13px}
a{color:var(--accent)}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:calc(14px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:19px;flex:none}
.brand h1{font-family:var(--f-display);font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em;line-height:1.1}
.brand .sub{color:var(--muted);font-size:13px}
.hright{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;font-weight:600}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.user{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 4px 3px 10px;font-size:13px}
.user b{font-weight:600}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
nav.tabs button{background:none;border:0;padding:10px 13px;border-bottom:2.5px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--crit);color:#fff;font-size:11px;line-height:18px;text-align:center;font-weight:600}
.banner{margin-top:12px;padding:9px 12px;border-radius:8px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.crit{background:var(--crit-soft);color:var(--crit)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.info{background:var(--info-soft);color:var(--info)}

main{padding-block:20px}
h2{font-family:var(--f-display);font-size:21px;margin:0 0 4px;text-wrap:balance}
h3{font-family:var(--f-display);font-size:17px;margin:0;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 16px;max-width:68ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.stack{display:grid;gap:16px}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:500;line-height:1.2;text-decoration:none;color:var(--fg);display:inline-block;text-align:center}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.big{padding:12px 18px;font-size:16px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.wa{background:#1F8F4E;border-color:#1F8F4E;color:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;border:0}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.mut{background:var(--sunk);color:var(--muted)}
button.chip{cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;min-width:0}
.kpi b{display:block;font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi span{font-size:12.5px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .main{min-width:0;flex:1}
.li .main b{font-weight:600}
.li .main .muted{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.cards{display:flex;flex-direction:column;gap:10px}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.note{font-size:13px;color:var(--muted);max-width:70ch}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.ok i{background:var(--ok)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:7px 12px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

/* moduli */
.form{display:grid;gap:12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
label.check{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:14px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;width:100%;color:var(--fg)}
input[type=checkbox],input[type=radio]{width:auto}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.full{grid-column:1/-1}

/* accesso */
.full-screen{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:16px;padding-block:32px;text-align:center}
.full-screen .logo{width:64px;height:64px;font-size:32px;border-radius:16px;margin:0 auto}
.full-screen h2{font-size:26px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;max-width:720px;margin:0 auto;width:100%}
.person{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:8px}
.person .av{width:48px;height:48px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:19px}
.person small{color:var(--muted)}
.pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center}
.pinpad button{height:64px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px;font-weight:600}
.dots{display:flex;gap:12px;justify-content:center;margin:6px 0}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent)}
.dots i.on{background:var(--accent)}

/* finestre */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column}
.modal.wide{max-width:900px}
.modal header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal .body{padding:16px 18px;display:grid;gap:14px}
.modal footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;max-width:min(90vw,520px);font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.err{background:var(--crit);color:#fff}
.qr svg{width:180px;height:180px;background:#fff;padding:6px;border-radius:8px}

@media (max-width:860px){.cols,.cols3{grid-template-columns:1fr}}
@media (max-width:480px){.pinpad{grid-template-columns:repeat(3,64px)}.brand h1{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{header.top,nav,.noprint{display:none!important}body{background:#fff;color:#000}}

/* Poltrona: agenda a colonne per collaboratore con griglia oraria, promemoria come fumetti WhatsApp */
.settimana{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.sday{flex:0 0 auto;min-width:84px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px;text-align:left;display:flex;flex-direction:column}
.sday small{color:var(--muted);font-size:11.5px;text-transform:capitalize}
.sday b{font-size:15px;font-variant-numeric:tabular-nums}
.sday[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sday[aria-pressed="true"] small{color:inherit;opacity:.8}
.agwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.ag{display:grid;min-width:min-content}
.agh{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);padding:9px 10px;font-weight:600;display:flex;align-items:center;gap:8px}
.agh i{width:10px;height:10px;border-radius:50%;flex:none}
.agh small{margin-left:auto;color:var(--muted);font-weight:500}
.ore{position:relative}
.ore div{position:absolute;right:8px;transform:translateY(-50%);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ore div:first-child{transform:none}
.col{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);cursor:copy}
.chiuso{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,var(--sunk) 0 6px,transparent 6px 12px);opacity:.8}
.adesso{position:absolute;left:0;right:0;height:2px;background:var(--crit);z-index:3;pointer-events:none}
.adesso::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--crit)}
.ap{position:absolute;left:4px;right:4px;z-index:1;border:0;border-left:4px solid var(--c);border-radius:7px;background:var(--surface);box-shadow:inset 0 0 0 999px color-mix(in srgb,var(--c) 16%,transparent),0 1px 2px rgba(0,0,0,.08);padding:4px 8px;text-align:left;overflow:hidden;font-size:12.5px;line-height:1.3;color:var(--fg);display:flex;flex-direction:column;cursor:pointer}
.ap b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap em{font-style:normal;font-size:11px;font-weight:700;color:var(--c)}
.ap.corto{flex-direction:row;align-items:center;gap:6px;padding-block:1px}
.ap.corto span,.ap.corto em{font-size:11.5px}
.ap.st-completato{opacity:.55}
.ap.st-arrivato{box-shadow:inset 0 0 0 999px color-mix(in srgb,var(--c) 30%,transparent),0 1px 2px rgba(0,0,0,.08)}
.ap.sposta{outline:2px dashed var(--warn);outline-offset:-2px}
.ap.blocco{--c:var(--muted);background:var(--sunk);box-shadow:none;border-left-style:dashed}
.srvcat{display:grid;grid-template-columns:90px minmax(0,1fr);gap:8px;align-items:start;margin-top:6px}
.srvs{display:flex;flex-wrap:wrap;gap:6px}
.srv{flex-direction:row;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--fg);font-size:14px;cursor:pointer}
.srv:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.srv span{display:flex;flex-direction:column;line-height:1.2}
.srv small{color:var(--muted);font-size:11.5px}
.tecnica{margin-top:4px;background:var(--accent-soft);color:var(--fg);border-radius:6px;padding:4px 8px}
.crit-t{color:var(--crit);font-weight:600}
.totale{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:10px}
.totale b{font-family:var(--f-display);font-size:24px}
.stamps{display:inline-flex;gap:3px;flex-wrap:wrap;vertical-align:middle}
.stamps i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--accent)}
.stamps i.on{background:var(--accent)}
.premio{background:var(--ok-soft);border-radius:8px;padding:8px 10px}
.wa-msg{background:var(--sunk);border-radius:12px 12px 12px 3px;padding:9px 12px;font-size:14px;max-width:62ch;white-space:pre-line;margin:8px 0}
.prom .row{gap:6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle}
.qty{display:inline-flex;align-items:center;gap:6px;margin-right:6px}
.qty b{min-width:28px;text-align:center}
tr.storno td{text-decoration:line-through;color:var(--muted)}
tr.storno td:last-child{text-decoration:none}
.orari{display:grid;gap:6px}
@media (max-width:620px){.srvcat{grid-template-columns:1fr}}


@media (max-width:760px){header.top{position:static}}
</style>

        var b0 = bin.read();

        var b2 = read();

      var bytes = [];

        if (c < 128) {

/* ---------- Disegno ---------- */
function onStato(prev){
  if(!UI.tab||!allowedTabs().includes(UI.tab)){let h="";try{h=location.hash.slice(1)}catch(e){}UI.tab=allowedTabs().includes(h)?h:allowedTabs()[0]}
  if(APP.onStato)APP.onStato(prev);
  const a=document.activeElement;
  if(a&&$("view").contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&!a.dataset.live){pendingRender=true;renderHeader();return}
  render();
  if(UI.modal&&APP.aggiornaModal)APP.aggiornaModal();
}
function renderHeader(){
  const top=$("top");top.hidden=false;const u=me(),tabs=allowedTabs();
  top.innerHTML=`<div class="wrap"><div class="brand"><div class="logo">${APP.LOGO}</div><div><h1>${esc(S.settings.nome)}</h1><div class="sub">${esc(APP.NOME)}${S.settings.citta?" · "+esc(S.settings.citta):""} · ${esc(dayLong(oggi()))}</div></div>
  <div class="hright">${S.meta.demo?`<span class="pill warn">Demo</span>`:""}${online?"":`<span class="pill crit">Non collegato</span>`}<span class="user"><b>${esc(u.nome)}</b><span class="muted">${esc(APP.RUOLI[u.ruolo]||"")}</span><button class="btn sm" data-act="logout">Esci</button></span></div></div>
  <nav class="tabs" role="tablist">${tabs.map(t=>{const n=APP.badge&&APP.badge[t]?APP.badge[t]():0;return`<button role="tab" aria-selected="${t===UI.tab}" data-act="tab" data-t="${t}">${esc(t==="impostazioni"?"Impostazioni":APP.TABS[t])}${n?`<span class="badge">${n}</span>`:""}</button>`}).join("")}</nav>
  <div id="banners"></div></div>`;
  renderBanners();
}
function renderBanners(){
  const b=$("banners");if(!b||!S)return;const l=lic(),out=[];
  if(!online)out.push(`<div class="banner crit">Collegamento perso con il computer dell'attività: le modifiche non vengono salvate finché non torna.</div>`);
  if(l.stato==="scaduta")out.push(`<div class="banner crit">Licenza scaduta il ${ddmmyy(l.scadenza)}: puoi consultare i dati ma non inserirne di nuovi. Contatta l'assistenza.</div>`);
  else if(l.stato==="tolleranza")out.push(`<div class="banner crit">Licenza scaduta: ancora ${15+l.giorni} giorni per rinnovarla prima del blocco.</div>`);
  else if(l.stato==="prova"&&isTit()&&!S.meta.demo)out.push(`<div class="banner info">Periodo di prova: ancora ${l.giorni} giorni. Per attivare la licenza vai in Impostazioni › Licenza.</div>`);
  else if(l.stato==="in_scadenza"&&isTit())out.push(`<div class="banner warn">La licenza scade tra ${l.giorni} giorni (${ddmmyy(l.scadenza)}).</div>`);
  if(APP.banners)out.push(...APP.banners());
  b.innerHTML=out.join("");
}
function render(){
  if(!S)return;pendingRender=false;renderHeader();
  const fn=UI.tab==="impostazioni"?renderImpostazioni:APP.render[UI.tab];
  const y=window.scrollY;
  $("view").innerHTML=fn?fn():"";
  window.scrollTo(0,y);
  if(APP.dopoRender)APP.dopoRender();
}

const ACT={

  closeModal(){closeModal()},
  tab(d){UI.tab=d.t;try{history.replaceState(null,"","#"+d.t)}catch(e){}render();window.scrollTo(0,0)},

  async setupOk(){const n=val("suNome").trim(),p=val("suPin");if(!n)return toast("Scrivi il nome dell'attività",true);if(!/^\d{4}$/.test(p))return toast("Il PIN deve avere 4 cifre",true);if(p!==val("suPin2"))return toast("I due PIN non sono uguali",true);

  pinIndietro(){schermataLogin()},
  pinDimenticato(){schermataSblocco(UI.pinUser)},
  sbIndietro(){pulisciUrl();schermataLogin()},
  async sbOk(){const p=val("sbPin");if(!/^\d{4}$/.test(p))return toast("Il PIN deve avere 4 cifre",true);if(p!==val("sbPin2"))return toast("I due PIN non sono uguali",true);

  tecNuovo(){schermataTecnicoAttiva()},

function renderAgenda(){

  const ini=Math.floor(Math.min(...S.settings.orari.filter(x=>x.aperto).map(x=>aMin(x.dalle)),aMin(o.dalle)||540)/60)*60;
  const fin=Math.ceil(Math.max(...S.settings.orari.filter(x=>x.aperto).map(x=>aMin(x.alle)),aMin(o.alle)||1170)/60)*60;
  const H=(fin-ini)*PXM,del=S.appuntamenti.filter(a=>a.data===d),vis=del.filter(a=>occ(a)),canc=del.filter(a=>!occ(a)&&!a.blocco);

  const tot=vis.filter(a=>!a.blocco).length,incP=vis.filter(a=>!a.blocco).reduce((s,a)=>s+a.servizi.reduce((t,x)=>t+x.prezzo,0),0);

  <div class="row"><button class="btn" data-act="agGiorno" data-k="${plusDays(d,-1)}" aria-label="Giorno prima">‹</button><button class="btn" data-act="agGiorno" data-k="${oggi()}">Oggi</button><button class="btn" data-act="agGiorno" data-k="${plusDays(d,1)}" aria-label="Giorno dopo">›</button><input type="date" id="agData" data-chg="agData" value="${d}" style="width:auto" aria-label="Vai al giorno">
  ${ruolo()==="collaboratore"?`<label class="check"><input type="checkbox" data-chg="agMiei" ${P.soloMiei?"checked":""}> Solo i miei</label>`:""}<button class="btn primary" data-act="apNuovo">+ Appuntamento</button></div></div>
  <div class="settimana">${week.map(k=>{const n=S.appuntamenti.filter(a=>a.data===k&&occ(a)&&!a.blocco).length;return`<button class="sday" aria-pressed="${k===d}" data-act="agGiorno" data-k="${k}"><small>${k===oggi()?"Oggi":new Date(k+"T12:00").toLocaleDateString("it-IT",{weekday:"short"})} ${+k.slice(8)}</small><b>${aperto(k)?n:"chiuso"}</b></button>`}).join("")}</div>
  <div class="agwrap"><div class="ag" style="grid-template-columns:52px repeat(${Math.max(1,cols.length)},minmax(170px,1fr))">
  <div class="agh"></div>${cols.map(x=>`<div class="agh"><i style="background:${esc(x.colore)}"></i>${esc(x.nome)}<small>${del.filter(a=>a.sid===x.id&&occ(a)&&!a.blocco).length}</small></div>`).join("")}
  <div class="ore" style="height:${H}px">${ore}</div>
  ${cols.map(x=>`<div class="col" data-act="agVuoto" data-sid="${x.id}" data-ini="${ini}" style="height:${H}px;background-size:100% ${60*PXM}px">${fasce}${nowM!=null&&nowM>=ini&&nowM<fin?`<div class="adesso" style="top:${(nowM-ini)*PXM}px"></div>`:""}
  ${vis.filter(a=>a.sid===x.id).map(a=>{const top=(aMin(a.ora)-ini)*PXM,h=Math.max(18,a.durata*PXM-2);
    if(a.blocco)return`<button class="ap blocco${h<40?" corto":""}" data-act="apBlocco" data-id="${a.id}" style="top:${top}px;height:${h}px"><b>${esc(a.motivo)}</b><span>${a.ora}–${daMin(fineA(a))}</span></button>`;

  </div></div>
  ${cols.length?"":`<div class="empty">Nessuna persona in agenda. Il titolare la attiva in Impostazioni › Persone e PIN.</div>`}
  ${canc.length?`<div class="panel"><h3>Annullati e non venuti</h3><div class="list">${canc.map(a=>`<div class="li"><div class="main"><b>${esc(a.nome)}</b> · ${a.ora} · ${esc(a.servizi.map(s=>s.nome).join(" + "))}<div class="muted">con ${esc(ST(a.sid).nome)}${a.motivo?" · "+esc(a.motivo):""}</div></div><span class="chip ${STATI[a.stato][1]}">${STATI[a.stato][0]}</span><button class="btn sm" data-act="apApri" data-id="${a.id}">Apri</button></div>`).join("")}</div></div>`:""}</div>`}

/* ---------- Promemoria ---------- */

  <div class="cards">${lista.map(a=>{const[stt,cl]=STATI[a.stato];return`<div class="card prom"><div class="spread"><div><b>${a.ora}</b> · <b>${esc(a.nome)}</b> <span class="muted">· ${esc(a.servizi.map(s=>s.nome).join(" + "))} · con ${esc(ST(a.sid).nome)}</span></div><div class="row"><span class="chip ${cl}">${stt}</span>${a.spostare?`<span class="chip warn">Vuole spostare</span>`:""}${a.promemoria?`<span class="chip mut">Mandato ${hhmm(a.promemoria)}</span>`:""}</div></div>
  ${a.tel?`<div class="wa-msg">${esc(testoProm(a))}</div><div class="row"><a class="btn ${a.promemoria?"":"wa"}" target="_blank" rel="noopener" href="${waLink(a.tel,testoProm(a))}" data-act="promInviato" data-id="${a.id}">${a.promemoria?"Rimanda":"Manda su WhatsApp"}</a>${a.stato!=="confermato"?`<button class="btn" data-act="promRisp" data-id="${a.id}" data-r="conferma">Ha risposto 1: conferma</button>`:""}<button class="btn" data-act="promRisp" data-id="${a.id}" data-r="sposta">Ha risposto 2: sposta</button><span class="muted small num">${esc(a.tel)}</span></div>`:`<div class="muted small">Nessun telefono: aggiungilo nell'appuntamento per mandare il promemoria.</div>`}</div>`}).join("")||`<div class="empty">Nessun appuntamento per questo giorno.</div>`}</div></div>`}

/* ---------- Cassa ---------- */
function renderCassa(){if(!P.cassa)P.cassa=oggi();const k=P.cassa,vs=S.vendite.filter(v=>v.giorno===k).sort((a,b)=>b.t-a.t),ok=vs.filter(v=>!v.stornato),tot=ok.reduce((s,v)=>s+v.totale,0);

  const daInc=k===oggi()?S.appuntamenti.filter(a=>a.data===k&&!a.blocco&&["arrivato","confermato","prenotato"].includes(a.stato)&&(a.stato==="arrivato"||aMin(a.ora)<=new Date(now()).getHours()*60+new Date(now()).getMinutes())).sort((a,b)=>a.ora.localeCompare(b.ora)):[];

  ${daInc.length?`<div class="panel"><h3>Da incassare adesso</h3><div class="list">${daInc.map(a=>`<div class="li"><div class="main"><b>${a.ora}</b> · ${esc(a.nome)} <span class="muted">· ${esc(a.servizi.map(s=>s.nome).join(" + "))} · ${esc(ST(a.sid).nome)}</span></div><span class="chip ${STATI[a.stato][1]}">${STATI[a.stato][0]}</span><button class="btn sm primary" data-act="apConto" data-id="${a.id}">Incassa</button></div>`).join("")}</div></div>`:""}
  <div class="cols"><div class="panel"><h3>Conti del giorno</h3><div class="tw"><table><thead><tr><th>Ora</th><th>Cliente</th><th>Voci</th><th>Con</th><th class="r">Totale</th><th></th></tr></thead><tbody>${vs.map(v=>`<tr class="${v.stornato?"storno":""}"><td class="num">${hhmm(v.t)}</td><td>${esc(v.nome)}${v.premio?` <span class="chip acc">premio</span>`:""}</td><td class="small">${esc(v.righe.map(r=>(r.q>1?r.q+"× ":"")+r.nome).join(", "))}${v.sconto?` · sconto ${eur(v.sconto)}`:""}</td><td>${esc(ST(v.sid).nome)}</td><td class="r num">${eur(v.totale)}<div class="muted small">${esc(METODI[v.metodo])}</div></td><td>${isTit()&&!v.stornato?`<button class="btn sm ghost" data-act="storno" data-id="${v.id}">Storna</button>`:v.stornato?`<span class="chip crit">Stornato</span>`:""}</td></tr>`).join("")||`<tr><td colspan="6" class="muted">Nessun incasso.</td></tr>`}</tbody></table></div></div>
  <div class="panel"><h3>Per collaboratore</h3><div class="list">${perSt.map(([x,v,n])=>`<div class="li"><span class="main"><i class="dot" style="background:${esc(x.colore)}"></i> ${esc(x.nome)} <span class="muted small">· ${n} conti</span></span><b class="num">${eur(v)}</b></div>`).join("")||`<div class="muted">Ancora niente.</div>`}</div></div></div></div>`}

/* ---------- Clienti ---------- */

/* ---------- Magazzino ---------- */
const sotto=()=>S.prodotti.filter(p=>p.qta<p.soglia);
const inOrdine=()=>new Set(S.ordiniForn.filter(o=>o.stato==="inviato").flatMap(o=>o.righe.map(r=>r.id)));
function renderMagazzino(){const io=inOrdine(),manc=sotto();
  return`<div class="stack"><div class="spread"><div><h2>Magazzino</h2><p class="lead" style="margin:0">Prodotti da usare in salone e da vendere. Sotto la soglia minima finiscono nell'ordine ai fornitori.</p></div><div class="row">${manc.length?`<button class="btn primary" data-act="mgOrdine">Prepara ordini (${manc.filter(p=>!io.has(p.id)).length})</button>`:""}<button class="btn" data-act="mgFornitori">Fornitori</button><button class="btn" data-act="mgNuovo">+ Prodotto</button></div></div>
  ${S.ordiniForn.filter(o=>o.stato==="inviato").map(o=>`<div class="banner info"><span>Ordine a <b>${esc((S.fornitori.find(f=>f.id===o.forn)||{nome:"fornitore"}).nome)}</b> del ${new Date(o.t).toLocaleDateString("it-IT")}: ${esc(o.righe.map(r=>fmtQ(r.q)+" "+r.um+" "+r.nome).join(", "))}</span><button class="btn sm" data-act="mgArrivato" data-id="${o.id}">È arrivato</button></div>`).join("")}
  <div class="panel"><div class="tw"><table><thead><tr><th>Prodotto</th><th>Uso</th><th>Fornitore</th><th class="r">Soglia</th><th>Quantità</th><th></th></tr></thead><tbody>${S.prodotti.slice().sort((a,b)=>(a.qta>=a.soglia)-(b.qta>=b.soglia)||a.nome.localeCompare(b.nome)).map(p=>`<tr><td><b>${esc(p.nome)}</b><div class="muted small">${esc(p.marca||"")}${p.uso==="vendita"?` · in vendita a ${eur(p.prezzo)}`:""}</div></td><td>${p.uso==="vendita"?"Vendita":"Salone"}</td><td class="small">${esc((S.fornitori.find(f=>f.id===p.forn)||{nome:"—"}).nome)}</td><td class="r num">${fmtQ(p.soglia)}</td>
  <td><div class="qty"><button class="btn sm" data-act="mgMov" data-id="${p.id}" data-d="-1" aria-label="Togli uno">−</button><b class="num">${fmtQ(p.qta)}</b><button class="btn sm" data-act="mgMov" data-id="${p.id}" data-d="1" aria-label="Aggiungi uno">+</button><span class="muted small">${esc(p.um)}</span></div>${p.qta<p.soglia?`<span class="chip ${io.has(p.id)?"info":"crit"}">${io.has(p.id)?"In ordine":"Sotto soglia"}</span>`:""}</td><td><button class="btn sm" data-act="mgModifica" data-id="${p.id}">Modifica</button></td></tr>`).join("")||`<tr><td colspan="6" class="muted">Nessun prodotto. Aggiungi tinte, shampoo, smalti…</td></tr>`}</tbody></table></div></div>
  <div class="panel"><h3>Ultimi movimenti</h3><div class="tw"><table><tbody>${S.movMag.slice(0,15).map(m=>`<tr><td class="num">${new Date(m.t).toLocaleString("it-IT",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</td><td>${esc(m.nome)}</td><td class="r num">${m.delta>0?"+":""}${fmtQ(m.delta)}</td><td>${esc(m.motivo)}</td><td class="muted">${esc(m.chi)}</td></tr>`).join("")||`<tr><td class="muted">Ancora niente.</td></tr>`}</tbody></table></div></div></div>`}
function formProdotto(p){p=p||{uso:"uso",um:"pz",qta:0,soglia:0};return`<div class="fgrid"><label>Nome<input id="mNome" value="${esc(p.nome||"")}"></label><label>Marca<input id="mMarca" value="${esc(p.marca||"")}"></label>
  <label>Uso<select id="mUso"><option value="uso" ${p.uso!=="vendita"?"selected":""}>Si usa in salone</option><option value="vendita" ${p.uso==="vendita"?"selected":""}>Si vende ai clienti</option></select></label><label>Unità<input id="mUm" value="${esc(p.um||"pz")}" placeholder="tubi, flaconi…"></label>
  ${p.id?"":`<label>Quantità attuale<input id="mQta" inputmode="decimal" value="${p.qta}"></label>`}<label>Soglia minima<input id="mSoglia" inputmode="decimal" value="${p.soglia}"></label><label>Costo (€)<input id="mCosto" inputmode="decimal" value="${p.costo||""}"></label><label>Prezzo di vendita (€)<input id="mPrezzo" inputmode="decimal" value="${p.prezzo||""}"></label>
  <label>Fornitore<select id="mForn"><option value="">—</option>${S.fornitori.map(f=>`<option value="${f.id}" ${p.forn===f.id?"selected":""}>${esc(f.nome)}</option>`).join("")}</select></label></div>`}
const qOrd=p=>Math.max(1,Math.ceil(p.soglia*2-p.qta));
function testoOrdine(f,righe){return`Buongiorno${f?" "+f.nome:""},\nsono ${me().nome} di ${S.settings.nome}. Vorremmo ordinare:\n${righe.map(p=>`- ${qOrd(p)} ${p.um} ${p.nome}${p.marca?" ("+p.marca+")":""}`).join("\n")}\n\nGrazie! ${firma()}`}

/* ---------- Report ---------- */
function renderReport(){const g0=oggi(),da=plusDays(g0,-29),vs=S.vendite.filter(v=>v.giorno>=da&&v.giorno<=g0&&!v.stornato),tot=vs.reduce((s,v)=>s+v.totale,0);
  const ap=S.appuntamenti.filter(a=>a.data>=da&&a.data<=g0&&!a.blocco),ns=ap.filter(a=>a.stato==="noshow").length;
  const perSt=S.staff.map(x=>[x,vs.filter(v=>v.sid===x.id)]).filter(x=>x[1].length).sort((a,b)=>b[1].reduce((s,v)=>s+v.totale,0)-a[1].reduce((s,v)=>s+v.totale,0));
  const srv={};vs.forEach(v=>v.righe.forEach(r=>{const x=srv[r.nome]=srv[r.nome]||{n:0,e:0};x.n+=r.q;x.e+=r.q*r.prezzo}));const top=Object.entries(srv).sort((a,b)=>b[1].e-a[1].e).slice(0,8);
  const lim=plusDays(g0,-45),futuri=new Set(S.appuntamenti.filter(a=>a.data>=g0&&occ(a)).map(a=>a.clienteId)),richiama=S.clienti.filter(c=>c.ultimaVisita&&c.ultimaVisita<lim&&c.tel&&!futuri.has(c.id)).sort((a,b)=>a.ultimaVisita.localeCompare(b.ultimaVisita)).slice(0,12);
